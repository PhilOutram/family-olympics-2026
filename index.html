<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a1a3a" />
  <title>Family Olympics 2026</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1.6.0" />
</head>
<body>
  <!-- Olympic anthem -->
  <audio id="anthem" src="assets/anthem.m4a" preload="auto" loop></audio>

  <!-- Torch / opening splash -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="rings big" aria-hidden="true">
        <span class="ring r-blue"></span><span class="ring r-yellow"></span><span class="ring r-black"></span><span class="ring r-green"></span><span class="ring r-red"></span>
      </div>
      <h1 class="splash-title">FAMILY<br />OLYMPICS</h1>
      <p class="splash-year">2026</p>
      <button id="startBtn" class="start-btn">🔥 Light the Torch</button>
      <p class="splash-hint">Tap to enter &amp; play the anthem</p>
    </div>
  </div>

  <!-- Header -->
  <header class="topbar">
    <div class="rings small" aria-hidden="true">
      <span class="ring r-blue"></span><span class="ring r-yellow"></span><span class="ring r-black"></span><span class="ring r-green"></span><span class="ring r-red"></span>
    </div>
    <div class="topbar-title">
      <span class="flame">🔥</span>
      <span>Family Olympics <b>2026</b></span>
    </div>
    <button id="muteBtn" class="mute-btn" title="Toggle anthem" aria-label="Toggle anthem">🔊</button>
  </header>

  <!-- Tab bar -->
  <nav id="tabs" class="tabs"></nav>

  <!-- Views -->
  <main id="view" class="view"></main>

  <footer class="foot">
    <span><span id="sync" class="sync">○ Connecting…</span> · <span id="version" class="version"></span></span>
    <button id="resetAllBtn" class="link-btn">Reset everything</button>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="script.js?v=1.6.0"></script>
</body>
</html>
